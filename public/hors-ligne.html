<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#009A3D">
  <title>Hors connexion - Baol Market</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
    }
    body {
      background-color: #005A22;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 2rem;
      display: block;
    }
    .icon-wrapper {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2rem;
      max-width: 420px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      min-height: 48px;
      padding: 0 2rem;
      background-color: #ffffff;
      color: #009A3D;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease, transform 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-retry:hover {
      opacity: 0.95;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .btn-retry:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      .btn-retry {
        transition: none;
        transform: none !important;
      }
    }
    @media (max-width: 360px) {
      h1 {
        font-size: 1.5rem;
      }
      p {
        font-size: 0.9375rem;
      }
      .logo {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <img src="/logo/logo-192x192.png" alt="Baol Market" width="120" height="120" class="logo">
    <div class="icon-wrapper" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>Vous êtes hors connexion</h1>
    <p>Vérifiez votre connexion internet, puis réessayez. Votre panier est conservé sur cet appareil.</p>
    <button type="button" id="retry-btn" class="btn-retry">Réessayer</button>
  </main>
  <script>
    (function() {
      var btn = document.getElementById('retry-btn');
      if (btn) {
        btn.addEventListener('click', function() {
          window.location.reload();
        });
      }
      window.addEventListener('online', function() {
        window.location.reload();
      });
    })();
  </script>
</body>
</html>
